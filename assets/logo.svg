<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#brandGrad)" stroke="#60a5fa" stroke-width="2" />
  
  <!-- Mini Grid inside Icon -->
  <rect x="22" y="24" width="16" height="12" rx="3" fill="#38bdf8" opacity="0.85" />
  <rect x="42" y="24" width="16" height="12" rx="3" fill="#f59e0b" opacity="0.85" />
  <rect x="62" y="24" width="16" height="12" rx="3" fill="#10b981" opacity="0.85" />
  
  <!-- Stylized R Letter -->
  <text x="32" y="74" font-family="'Cairo', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff">R</text>
  
  <!-- Golden Lightning Badge -->
  <circle cx="76" cy="22" r="11" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5" />
  <text x="71" y="26" font-size="11" font-weight="bold" fill="#ffffff">⚡</text>

  <!-- Brand Typography -->
  <text x="106" y="52" font-family="'Cairo', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">Rzzak<tspan fill="#38bdf8">Fet</tspan></text>
  <text x="108" y="76" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">منظومة الجداول المدرسية المغربية الذكية</text>
</svg>
